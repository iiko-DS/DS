<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>pc</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body><iframe id="f" style="width:1920px;height:3200px;border:0"></iframe><pre id="out">…</pre>
<script>
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
f.onload=function(){try{
 var d=f.contentDocument;
 var cols=[].slice.call(d.querySelectorAll('.plats .plat'));
 L.push('колонок: '+cols.length);
 cols.forEach(function(c,i){var r=c.getBoundingClientRect();
   L.push('  ['+i+'] '+c.querySelector('.plat__title').textContent+' — x='+Math.round(r.left)+' ширина='+Math.round(r.width)+' top='+Math.round(r.top));});
 var tops=new Set(cols.map(function(c){return Math.round(c.getBoundingClientRect().top);}));
 L.push('все в один ряд: '+(tops.size===1));
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src','../../../iiko-ds-mobile/prototypes/recommendations/button.html');
</script></body></html>

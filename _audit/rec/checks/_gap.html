<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>GAP</title>
<style>
html,body{margin:0;background:#f4f5f7;font:13px/18px monospace;color:#333}
body{padding:24px;box-sizing:border-box}
.wrap{width:100%;max-width:100%}
/* копия оболочки index.html: колонка меню + колонка страницы */
.kit{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.nav{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:8px;box-sizing:border-box;min-height:400px}
.frame{width:100%;border:0;display:block;min-height:600px;background:transparent}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:16px;box-sizing:border-box;margin:0 0 16px}
.kit .card{margin:16px 24px 0}
pre{white-space:pre-wrap;margin:12px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="kit">
    <nav class="nav" id="nav">меню</nav>
    <div id="col">
      <iframe class="frame" id="frame" title="Страница компонента"></iframe>
      <div class="card" id="note"><h2>Общее для всех компонентов</h2><p>текст блока</p></div>
    </div>
  </div>
</div>
<pre id="out"></pre>
<script>
var SLUGS = ["autocomplete", "backdrop", "badge", "banners", "button", "button-icon", "button-toggle", "card", "checkbox", "chips", "chips-input", "datepicker", "dialog", "divider", "expansion-panel", "form-field", "hint-tooltip", "icon-size", "input-number", "list", "logo", "menu", "radio", "scroll", "search", "select", "sidenav", "slide-toggle", "snackbar", "status", "stepper", "table", "table-2-lvl", "tabs", "text-ui", "textarea", "timepicker", "tree"];
var BASE = '../../../iiko-ds-mobile/prototypes/recommendations/';
var out = document.getElementById('out');
var frame = document.getElementById('frame');
var note = document.getElementById('note');
var lines = [];
var i = 0;

function fit() {
  var d = frame.contentDocument;
  if (!d) return 0;
  var h = Math.max(d.documentElement.scrollHeight, 600);
  frame.style.height = h + 'px';
  return h;
}

function measure(slug, setH) {
  var d = frame.contentDocument;
  var body = d.body;
  var kids = [].slice.call(body.querySelectorAll('div.wrap > *'));
  var last = kids.length ? kids[kids.length - 1] : null;
  var lastBottom = last ? last.getBoundingClientRect().bottom + window.scrollY * 0 : last.getBoundingClientRect().bottom : -1;
  var pd = parseFloat(d.defaultView.getComputedStyle(body).paddingBottom) || 0;
  var fr = frame.getBoundingClientRect();
  var nr = note.getBoundingClientRect();
  return [slug,
          'h_set=' + setH,
          'h_rt=' + Math.round(fr.height),
          'scrollH=' + d.documentElement.scrollHeight,
          'lastBottom=' + Math.round(lastBottom),
          'leftover=' + Math.round(fr.height - lastBottom),
          'bodyPadBottom=' + pd,
          'noteGap=' + Math.round(nr.top - fr.bottom),
          'total=' + Math.round(nr.top - fr.top - lastBottom)].join(' | ');
}

function step() {
  if (i >= SLUGS.length) {
    out.textContent = lines.join(String.fromCharCode(10));
    document.title = 'DONE ' + lines.length;
    return;
  }
  var slug = SLUGS[i++];
  frame.onload = function () {
    setTimeout(function () {
      var setH = fit();
      var rec = null;
      try { rec = measure(slug, setH); } catch (e) { rec = slug + ' | ERROR ' + e; }
      lines.push(rec);
      // второй проход: сначала высота по контенту, потом ждём шрифты и меряем ещё раз
      var d = frame.contentDocument;
      var fontsReady = d.fonts && d.fonts.ready ? d.fonts.ready : Promise.resolve();
      fontsReady.then(function () {
        setTimeout(function () {
          try {
            var fr2 = frame.getBoundingClientRect();
            var h2 = Math.max(d.documentElement.scrollHeight, 600);
            lines.push('   после шрифтов: scrollH=' + d.documentElement.scrollHeight +
                       ' h_set=' + h2 + ' leftover=' + Math.round(fr2.height - (function () {
                         var kids = [].slice.call(d.body.querySelectorAll('div.wrap > *'));
                         var last = kids.length ? kids[kids.length - 1] : null;
                         return last ? last.getBoundingClientRect().bottom : -1;
                       })()));
          } catch (e) { lines.push('   после шрифтов: ERROR ' + e); }
          step();
        }, 150);
      });
    }, 400);
  };
  frame.setAttribute('src', BASE + slug + '.html');
}
step();
</script>
</body>
</html>

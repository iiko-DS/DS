<!doctype html><meta charset="utf-8"><body><pre id="out"></pre><script>
const P=[["button", [[".ds-btn--m", "height", "44"], [".ds-btn--s", "height", "44"], [".ds-btn--xs", "height", "44"], [".ds-btn--m::after", "min-height", "48"]]], ["button-icon", [[".ds-btn-icon--m", "height", "40"], [".ds-btn-icon--xs", "height", "40"], [".ds-btn-icon--m::after", "min-height", "48"]]], ["button-toggle", [[".ds-button-toggle", "height", "52"]]], ["slide-toggle", [[".ds-slide-toggle__track", "width", "52"], [".ds-slide-toggle__track", "height", "32"], [".ds-slide-toggle", "height", "48"]]], ["stepper", [[".ds-stepper--vertical .ds-step", "height", "48"]]], ["form-field", [[".ds-input--m .ds-input__frame", "height", "56"]]], ["checkbox", [[".ds-checkbox", "height", "48"]]], ["radio", [[".ds-radio", "height", "48"]]], ["textarea", [[".ds-textarea__input-frame", "height", "104"]]], ["input-number", [[".ds-input-number__frame", "height", "56"]]], ["select", [[".ds-select-container", "width", "883"], [".ds-select-form__input-frame", "height", "56"]]], ["autocomplete", [[".ds-autocomplete-form__input-frame", "height", "56"]]], ["datepicker", [[".ds-input-datepicker__frame", "height", "56"]]], ["timepicker", [[".ds-input-timepicker__frame", "height", "56"], [".ds-elements-2", "height", "48"]]], ["menu", [[".ds-menu-item", "height", "72"], [".ds-menu-container", "width", "883"]]], ["hint-tooltip", [[".ds-hint-container", "width", "883"]]], ["dialog", [[".ds-dialog-view", "width", "883"]]], ["search", [[".ds-search", "width", "883"]]], ["sidenav", [[".ds-sidenav-view", "width", "360"], [".ds-sidenav-item--l1", "height", "48"]]], ["table", [[".ds-table-content-cell", "height", "52"]]], ["tree", [[".ds-tree-item", "height", "48"]]], ["text-ui", [[".ds-text-ui__list-item", "font-size", "16"]]], ["list", [[".ds-list-item", "height", "72"]]], ["expansion-panel", [[".ds-expansion__header", "height", "48"]]]], OUT=[]; let i=0;
function next(){ if(i>=P.length){document.getElementById('out').textContent=OUT.join('\n');return;}
 const [page, cs]=P[i++]; const f=document.createElement('iframe'); f.style.cssText='width:1500px;height:1300px;border:0';
 f.src='/iiko-ds-mobile/prototypes/recommendations/'+page+'.html';
 f.onload=()=>setTimeout(()=>{const d=f.contentDocument, w=f.contentWindow;
   d.querySelectorAll('.panel').forEach(pan=>{ const mode=pan.dataset.mode;
     for (const [sel,prop,exp] of cs){ const el = pan.querySelector(sel.split('::')[0]);
       if(!el){OUT.push('НЕТ '+page+' '+mode+' '+sel); continue;}
       const pseudo = sel.includes('::after') ? '::after' : null;
       const v = w.getComputedStyle(el, pseudo)[prop];
       const num = Math.round(parseFloat(v) * (v.includes('rem') ? 16 : 1));
       OUT.push((num === parseInt(exp) ? 'OK  ' : 'МИМО')+' '+page+' ['+mode+'] '+sel+' '+prop+'='+(v||'—')+' (ждали '+exp+')');
     }});
   f.remove(); next();},320);
 document.body.appendChild(f);}
next();</script></body>

<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>p8</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body><iframe id="f" style="width:1920px;height:2200px;border:0"></iframe><pre id="out">pending</pre>
<script>
var BASE='../../../iiko-ds-mobile/prototypes/recommendations/';
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
function d2(d,q){return [].map.call(d.querySelectorAll(q),function(e){var r=e.getBoundingClientRect();return Math.round(r.width)+'x'+Math.round(r.height);}).join(' ');}
f.onload=function(){try{
 var d=f.contentDocument;
 var s2='.phones__item:nth-child(2) ';
 L.push('экран 2 ДО:');
 L.push('  кнопки (текст/иконка): '+d2(d,s2+'.phone__body .ds-btn'));
 L.push('  только иконки: '+d2(d,s2+'.ds-btn-icon'));
 var i=d.querySelector('.edit__input[data-id="height"]'); i.value=40; i.dispatchEvent(new Event('input'));
 L.push('после ввода 40:');
 L.push('  кнопки: '+d2(d,s2+'.phone__body .ds-btn'));
 L.push('  только иконки (другой компонент, полем не правится): '+d2(d,s2+'.ds-btn-icon'));
 L.push('  десктоп: '+d2(d,'.panel[data-mode="desktop"] .ds-btn'));
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src',BASE+'button.html');
</script></body></html>

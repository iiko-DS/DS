<!doctype html><meta charset="utf-8"><body><pre id="out"></pre><script>
const PAGES=["autocomplete", "backdrop", "badge", "banners", "button", "button-icon", "button-toggle", "card", "checkbox", "chips", "chips-input", "datepicker", "dialog", "divider", "expansion-panel", "form-field", "hint-tooltip", "icon-size", "input-number", "list", "logo", "menu", "radio", "scroll", "search", "select", "sidenav", "slide-toggle", "snackbar", "status", "stepper", "table", "table-2-lvl", "tabs", "text-ui", "textarea", "timepicker", "tree"], OUT=[]; let i=0;
function lum(rgb){const m=rgb.match(/[\d.]+/g); if(!m) return null;
  const [r,g,b]=m.slice(0,3).map(Number).map(v=>{v/=255; return v<=0.03928? v/12.92 : Math.pow((v+0.055)/1.055,2.4);});
  return 0.2126*r+0.7152*g+0.0722*b;}
function effBg(el, win){let a=el; while(a && a!==win.document.documentElement){const c=win.getComputedStyle(a);
  if(c.backgroundColor && c.backgroundColor!=='rgba(0, 0, 0, 0)' && c.opacity!=='0') return c.backgroundColor; a=a.parentElement;}
  return 'rgb(255,255,255)';}
function ratio(a,b){const l1=lum(a), l2=lum(b); if(l1==null||l2==null) return null;
  const hi=Math.max(l1,l2), lo=Math.min(l1,l2); return (hi+0.05)/(lo+0.05);}
function scan(doc, win, page){
  doc.querySelectorAll('.panel').forEach(panel=>{
    const mode=panel.dataset.mode||'desktop';
    panel.querySelectorAll('*').forEach(el=>{
      const own=[...el.childNodes].some(n=>n.nodeType===3 && n.textContent.trim());
      if(!own) return;
      const c=win.getComputedStyle(el); if(c.visibility==='hidden'||c.display==='none'||c.opacity==='0') return;
      const r=ratio(c.color, effBg(el,win)); if(r==null) return;
      if(r < 2.0) OUT.push(page+' ['+mode+'] '+((el.className||el.tagName)+'').slice(0,42)+' | контраст '+r.toFixed(2)+' | текст: '+el.textContent.trim().slice(0,28));
    });
  });
}
function next(){ if(i>=PAGES.length){document.getElementById('out').textContent=OUT.join('\n');return;}
  const page=PAGES[i++]; const f=document.createElement('iframe'); f.style.cssText='width:1500px;height:1300px;border:0';
  f.src='/iiko-ds-mobile/prototypes/recommendations/'+page+'.html';
  f.onload=()=>setTimeout(()=>{scan(f.contentDocument, f.contentWindow, page); f.remove(); next();},320);
  document.body.appendChild(f);}
next();
</script></body>

<!doctype html><meta charset="utf-8"><body><pre id="out">pending</pre>
<script>
const SLUGS=["autocomplete", "backdrop", "badge", "banners", "button-icon", "button-toggle", "button", "card", "checkbox", "chips-input", "chips", "datepicker", "dialog", "divider", "expansion-panel", "form-field", "hint-tooltip", "icon-size", "input-number", "list", "logo", "menu", "radio", "scroll", "search", "select", "sidenav", "slide-toggle", "snackbar", "status", "stepper", "table-2-lvl", "table", "tabs", "text-ui", "textarea", "timepicker", "tree"], OUT=[]; let i=0;
const N="\u043f\u0430\u0442\u0442\u0435\u0440\u043d\u044b";
function next(){
  if(i>=SLUGS.length){document.getElementById('out').textContent=OUT.join('\n');return;}
  const slug=SLUGS[i++];
  const f=document.createElement('iframe');
  f.style.cssText='width:1600px;height:1200px;border:0;position:absolute;left:-99999px';
  f.src='/iiko-ds-mobile/prototypes/recommendations/'+slug+'.html';
  f.onload=()=>setTimeout(()=>{
    try{
      const d=f.contentDocument,w=f.contentWindow;
      const c=[...d.querySelectorAll('.card')].find(x=>x.querySelector('h2')&&x.querySelector('h2').textContent.includes(N));
      [...c.querySelectorAll('.pat__panel .pat__ex')].forEach((ex,pi)=>{
        [...ex.querySelectorAll('*')].forEach(n=>{
          const t=(n.textContent||'').trim();
          if(!t || n.children.length) return;
          const s=w.getComputedStyle(n);
          const bg=s.backgroundColor, col=s.color;
          const opaque = bg && bg!=='rgba(0, 0, 0, 0)' && bg!=='transparent';
          if(opaque && bg===col) OUT.push(slug+' | таб '+(pi+1)+' | '+n.className+' | «'+t.slice(0,24)+'» | bg=color='+bg);
        });
      });
    }catch(e){OUT.push(SLUGS[i-1]+' | ОШИБКА '+e.message);}
    f.remove(); next();
  },320);
  document.body.appendChild(f);
}
next();
</script></body>

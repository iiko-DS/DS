<!DOCTYPE html>
<html lang="ru">
<head><meta charset="UTF-8"><title>probe-hint</title>
<style>pre{font:14px/18px monospace;white-space:pre-wrap}</style></head>
<body>
<iframe id="f" style="width:1920px;height:1200px;border:0"></iframe>
<pre id="out">pending</pre>
<script>
var BASE = '../../../iiko-ds-mobile/prototypes/recommendations/';
var f = document.getElementById('f'), out = document.getElementById('out'), lines = [];
f.onload = function () {
  try {
    var d = f.contentDocument;
    var sel = function (panel, q) {
      var p = d.querySelector('.panel[data-mode="' + panel + '"]');
      return p ? p.querySelector(q) : null;
    };
    var info = function (panel, q) {
      var el = sel(panel, q);
      if (!el) return panel + ' ' + q + ': нет элемента';
      var cs = d.defaultView.getComputedStyle(el);
      var r = el.getBoundingClientRect();
      return panel + ' ' + q + ': w=' + Math.round(r.width) + ' h=' + Math.round(r.height) +
             ' pad=' + cs.paddingTop + '/' + cs.paddingRight + '/' + cs.paddingBottom + '/' + cs.paddingLeft +
             ' gap=' + cs.gap + ' radius=' + cs.borderTopLeftRadius + ' font=' + cs.fontSize + '/' + cs.lineHeight +
             ' weight=' + cs.fontWeight + ' pad-box=' + cs.boxSizing;
    };
    ['desktop', 'mobile'].forEach(function (m) {
      lines.push('=== панель ' + m + ' ===');
      ['.ds-hint-container', '.ds-hint-container__arrow', '.ds-hint-container__header',
       '.ds-hint-container__content', '.ds-hint-container__footer',
       '.ds-hint-header__label', '.ds-hint-content__label', '.ds-hint-footer__label',
       '.ds-hint-footer .ds-btn'].forEach(function (q) { lines.push('  ' + info(m, q)); });
    });
    out.textContent = lines.join(String.fromCharCode(10));
  } catch (e) { out.textContent = 'ERR ' + e; }
};
f.setAttribute('src', BASE + 'hint-tooltip.html');
</script>
</body></html>

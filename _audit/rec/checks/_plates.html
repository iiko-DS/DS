<!doctype html><meta charset="utf-8"><body><pre id="out"></pre><script>
const PAGES = ["autocomplete", "backdrop", "badge", "banners", "button", "button-icon", "button-toggle", "card", "checkbox", "chips", "chips-input", "datepicker", "dialog", "divider", "expansion-panel", "form-field", "hint-tooltip", "icon-size", "input-number", "list", "logo", "menu", "radio", "scroll", "search", "select", "sidenav", "slide-toggle", "snackbar", "status", "stepper", "table", "table-2-lvl", "tabs", "text-ui", "textarea", "timepicker", "tree"]; const OUT=[]; let i=0;
// Ищем «плашки»: фон совпадает с цветом текста → текст не виден (артефакт автогена ДС).
function scan(doc, tag){
  const res = [];
  for (const el of doc.querySelectorAll('.panel *')) {
    const cs = getComputedStyle(el);
    const bg = cs.backgroundColor, fg = cs.color;
    if (bg === 'rgba(0, 0, 0, 0)' || bg === 'transparent') continue;
    const own = [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
    if (!own) continue;
    if (bg === fg) res.push(tag + ' | ' + el.className + ' | bg=' + bg + ' fg=' + fg + ' | ' + el.textContent.trim().slice(0, 26));
  }
  return res;
}
function next(){
  if (i >= PAGES.length) { document.getElementById('out').textContent = OUT.join('\n'); return; }
  const page = PAGES[i++];
  const f = document.createElement('iframe'); f.style.cssText='width:1500px;height:1300px;border:0';
  f.src = '/iiko-ds-mobile/prototypes/recommendations/' + page + '.html';
  f.onload = () => setTimeout(() => {
    const d = f.contentDocument;
    d.querySelectorAll('.panel').forEach(p => OUT.push(...scan(p, page + ' [' + (p.dataset.mode || 'desktop') + ']')));
    f.remove(); next();
  }, 320);
  document.body.appendChild(f);
}
next();
</script></body>

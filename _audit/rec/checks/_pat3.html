<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style><body>
<iframe id="f" src="/iiko-ds-mobile/prototypes/recommendations/button.html" width="1600" height="5000"></iframe>
<script>
const k=parseInt((location.search.match(/tab=(\d+)/)||[])[1]||"0",10);
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument,w=f.contentWindow;
  const N="\u043f\u0430\u0442\u0442\u0435\u0440\u043d\u044b";
  const c=[...d.querySelectorAll('.card')].find(x=>x.querySelector('h2')&&x.querySelector('h2').textContent.includes(N));
  const tabs=[...c.querySelectorAll('.pat__tabs .ds-tab')];
  tabs[k].click();
  const top=Math.round(c.getBoundingClientRect().top+w.scrollY);
  f.style.height=Math.round(c.getBoundingClientRect().height)+40+'px';
  w.scrollTo(0, Math.max(0, top-10));
},450);
</script></body>

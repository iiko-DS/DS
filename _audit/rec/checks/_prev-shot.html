<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style><body>
<iframe id="f" width="1600" height="5000"></iframe>
<script>
const q=new URLSearchParams(location.search), slug=q.get('slug')||'card';
const f=document.getElementById('f'); f.src='/iiko-ds-mobile/prototypes/recommendations/'+slug+'.html';
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument,w=f.contentWindow;
  const c=[...d.querySelectorAll('.card')].find(x=>x.querySelector('h2')&&x.querySelector('h2').textContent.trim()==='\u041d\u0430 \u044d\u043a\u0440\u0430\u043d\u0435');
  const r=c.getBoundingClientRect(), top=Math.round(r.top+w.scrollY);
  const phones=c.querySelector('.phones');
  f.style.height=Math.round(Math.max(phones?phones.getBoundingClientRect().height:600, 600))+40+'px';
  w.scrollTo(0, Math.max(0, top-10));
},600);
</script></body>

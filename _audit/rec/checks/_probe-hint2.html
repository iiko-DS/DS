<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>p</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body>
<iframe id="f" style="width:1920px;height:1200px;border:0"></iframe><pre id="out">pending</pre>
<script>
var BASE='../../../iiko-ds-mobile/prototypes/recommendations/';
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
var Q=['.ds-hint-container','.ds-hint-container--default','.ds-hint-header','.ds-hint-content','.ds-hint-footer','.ds-hint-container__arrow'];
f.onload=function(){try{
 var d=f.contentDocument;
 ['desktop','mobile'].forEach(function(m){
  var p=d.querySelector('.panel[data-mode="'+m+'"]'); L.push('=== '+m+' ===');
  Q.forEach(function(q){
   var els=p?p.querySelectorAll(q):[]; if(!els.length){L.push('  '+q+': нет на странице');return;}
   var el=els[0],cs=d.defaultView.getComputedStyle(el),r=el.getBoundingClientRect();
   L.push('  '+q+': radius='+cs.borderTopLeftRadius+'/'+cs.borderBottomRightRadius+' bg='+cs.backgroundColor+' w='+Math.round(r.width)+' h='+Math.round(r.height));
  });
 });
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src',BASE+'hint-tooltip.html');
</script></body></html>

<!doctype html><meta charset="utf-8"><body><pre id="out"></pre>
<iframe id="f" src="/iiko-ds-mobile/prototypes/recommendations/card.html" width="1600" height="5000" style="border:0"></iframe>
<script>
const f=document.getElementById('f');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument,w=f.contentWindow;
  const s1=d.querySelector('.phones__item .phone__screen'), s2=d.querySelectorAll('.phones__item')[1].querySelector('.phone__screen');
  const f0=d.querySelector('.edit__input');
  f0.value='20'; f0.dispatchEvent(new w.Event('input',{bubbles:true}));
  const r1=w.getComputedStyle(s1.querySelector('.ds-card')).borderRadius, r2=w.getComputedStyle(s2.querySelector('.ds-card')).borderRadius;
  document.getElementById('out').textContent=JSON.stringify({rule:d.getElementById('live').textContent, radius_экран1:r1, radius_экран2:r2});
},700);
</script></body>

<!doctype html><meta charset="utf-8"><body><pre id="out">pending</pre><script>
const SLUGS=["autocomplete", "backdrop", "badge", "banners", "button-icon", "button-toggle", "button", "card", "checkbox", "chips-input", "chips", "datepicker", "dialog", "divider", "expansion-panel", "form-field", "hint-tooltip", "icon-size", "input-number", "list", "logo", "menu", "radio", "scroll", "search", "select", "sidenav", "slide-toggle", "snackbar", "status", "stepper", "table-2-lvl", "table", "tabs", "text-ui", "textarea", "timepicker", "tree"], OUT=[]; let i=0;
function next(){
  if(i>=SLUGS.length){document.getElementById('out').textContent=OUT.join('\n');return;}
  const slug=SLUGS[i++]; const f=document.createElement('iframe');
  f.style.cssText='width:1600px;height:1200px;border:0;position:absolute;left:-99999px';
  f.src='/iiko-ds-mobile/prototypes/recommendations/'+slug+'.html';
  f.onload=()=>setTimeout(()=>{ try{
    const d=f.contentDocument;
    const items=[...d.querySelectorAll('.phones__item')];
    if(items.length!==2){OUT.push(slug+' | экранов '+items.length); f.remove(); next(); return;}
    function clean(root){
      const c=root.cloneNode(true);
      c.querySelectorAll('.phone__sheet,.phone__scrim,.phone__caption').forEach(n=>n.remove());
      c.querySelectorAll('[data-preview]').forEach(n=>n.removeAttribute('data-preview'));
      return c.innerHTML.replace(/\s+/g,' ').trim();
    }
    const a=clean(items[0]), b=clean(items[1]);
    if(a===b){OUT.push(slug+' | одинаково');}
    else{
      let k=0; while(k<Math.min(a.length,b.length) && a[k]===b[k]) k++;
      OUT.push(slug+' | РАЗНОЕ с символа '+k+' :: 1>«'+a.slice(Math.max(0,k-40),k+90)+'» :: 2>«'+b.slice(Math.max(0,k-40),k+90)+'»');
    }
  }catch(e){OUT.push(SLUGS[i-1]+' | ОШИБКА '+e.message);} f.remove(); next(); },340);
  document.body.appendChild(f);
}
next();
</script></body>

<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>p9</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body><iframe id="f" style="width:1920px;height:2200px;border:0"></iframe><pre id="out">pending</pre>
<script>
var BASE='../../../iiko-ds-mobile/prototypes/recommendations/';
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
f.onload=function(){try{
 var d=f.contentDocument;
 var line=d.querySelector('.phone__line');
 var items=[].slice.call(line.children).map(function(e){return Math.round(e.getBoundingClientRect().width)+'x'+Math.round(e.getBoundingClientRect().height);});
 L.push('строка кнопок: '+items.join(' | '));
 L.push('ширина строки: client='+line.clientWidth+' scroll='+line.scrollWidth+' (переноса нет: '+(getComputedStyle(line).flexWrap)+')');
 var tops=[].slice.call(line.children).map(function(e){return Math.round(e.getBoundingClientRect().top);});
 L.push('одна линия (все top равны): '+(new Set(tops).size===1));
 var i=d.querySelector('.edit__input[data-id="height"]'); i.value=40; i.dispatchEvent(new Event('input'));
 L.push('после ввода 40: '+[].slice.call(line.querySelectorAll('.ds-btn')).map(function(e){return Math.round(e.getBoundingClientRect().width)+'x'+Math.round(e.getBoundingClientRect().height);}).join(' | '));
 L.push('иконка-кнопка (другой компонент): '+Math.round(line.querySelector('.ds-btn-icon').getBoundingClientRect().height));
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src',BASE+'button.html');
</script></body></html>

<!doctype html><meta charset="utf-8"><body><pre id="out"></pre>
<iframe id="f" src="/iiko-ds-mobile/prototypes/recommendations/button.html" width="1600" height="5000" style="border:0"></iframe>
<script>
const f=document.getElementById('f'),out=document.getElementById('out');
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument,N="\u043f\u0430\u0442\u0442\u0435\u0440\u043d\u044b";
  const c=[...d.querySelectorAll('.card')].find(x=>x.querySelector('h2')&&x.querySelector('h2').textContent.includes(N));
  const bar=c.querySelector('.pat__tabs'); const tabs=[...bar.querySelectorAll('.ds-tab')];
  out.textContent=JSON.stringify({barW:Math.round(bar.getBoundingClientRect().width),
    sumTabs:Math.round(tabs.reduce((s,t)=>s+t.getBoundingClientRect().width,0)),
    scroll:bar.scrollWidth, fits: bar.scrollWidth<=Math.ceil(bar.getBoundingClientRect().width),
    h:Math.round(tabs[0].getBoundingClientRect().height)});
},500);
</script></body>

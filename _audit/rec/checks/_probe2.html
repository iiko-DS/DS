<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>probe2</title>
<style>
html,body{margin:0;background:#fff}
pre{font:16px/20px monospace;margin:12px;white-space:pre-wrap}
#shell{position:fixed;left:-3000px;top:0;width:1920px;height:3600px;border:0}
</style>
</head>
<body>
<pre id="out">...</pre>
<iframe id="shell"></iframe>
<script>
var BASE = '../../../iiko-ds-mobile/prototypes/recommendations/';
var SLUGS = ['button', 'dialog', 'sidenav', 'table-2-lvl', 'autocomplete', 'card'];
var shell = document.getElementById('shell');
var out = document.getElementById('out');
var lines = [];

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

function loadShell(slug) {
  return new Promise(function (resolve) {
    shell.onload = function () { resolve(); };
    shell.setAttribute('src', BASE + 'index.html#' + slug);
  });
}

function read(slug, when) {
  var d = shell.contentDocument;               // документ оболочки
  var f = d.getElementById('frame');           // её фрейм со страницей компонента
  if (!f) return slug + ' ' + when + ': нет фрейма';
  var fd = f.contentDocument;
  if (!fd) return slug + ' ' + when + ': нет документа фрейма';
  var kids = [].slice.call(fd.querySelectorAll('div.wrap > *'));
  var last = kids[kids.length - 1];
  var lb = last ? last.getBoundingClientRect().bottom : -1;
  var fh = Math.round(f.getBoundingClientRect().height);
  var note = d.querySelector('.kit .card');
  var nr = note.getBoundingClientRect();
  var fr = f.getBoundingClientRect();
  return [slug, when,
          'frameH=' + fh,
          'scrollH=' + fd.documentElement.scrollHeight,
          'last=' + (last ? (last.tagName + '.' + (last.className || '-')) : 'нет'),
          'lastBottom=' + Math.round(lb),
          'inside=' + Math.round(fh - lb),
          'noteGap=' + Math.round(nr.top - fr.bottom),
          'total=' + Math.round(nr.top - fr.top - lb)].join(' ');
}

async function run() {
  for (var i = 0; i < SLUGS.length; i++) {
    var slug = SLUGS[i];
    await loadShell(slug);
    lines.push(read(slug, 'на load     '));
    var fd2 = shell.contentDocument.getElementById('frame').contentDocument;
    try { if (fd2.fonts && fd2.fonts.ready) await fd2.fonts.ready; } catch (e) {}
    await wait(600);
    lines.push(read(slug, 'после шрифт '));
    out.textContent = lines.join(String.fromCharCode(10));
  }
  out.textContent = lines.join(String.fromCharCode(10));
  document.title = 'READY';
}
run();
</script>
</body>
</html>

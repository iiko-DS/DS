<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>p</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body><iframe id="f" style="width:1920px;height:1400px;border:0"></iframe><pre id="out">pending</pre>
<script>
var BASE='../../../iiko-ds-mobile/prototypes/recommendations/';
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
function m(d,panel,q,what){
  var el=d.querySelector('.panel[data-mode="'+panel+'"] '+q); if(!el) return panel+' '+q+': нет';
  var cs=d.defaultView.getComputedStyle(el), r=el.getBoundingClientRect();
  return panel+' '+q+': h='+Math.round(r.height)+' w='+Math.round(r.width)+' '+what+'='+cs[what];
}
f.onload=function(){try{
 var d=f.contentDocument;
 L.push('ДО ПРАВКИ:');
 L.push('  '+m(d,'desktop','.ds-btn--m','height'));
 L.push('  '+m(d,'mobile','.ds-btn--m','height')+' / '+m(d,'mobile','.ds-btn--m','paddingTop')+' / '+m(d,'mobile','.ds-btn--m','paddingLeft'));
 L.push('  '+m(d,'mobile','.ds-btn__icon','fontSize'));
 var fh=d.querySelector('.edit__input[aria-label="Высота"]');
 L.push('поле «Высота» = '+fh.value+' | data-sel='+fh.getAttribute('data-sel'));
 fh.value=40; fh.dispatchEvent(new Event('input'));
 var pi=d.querySelector('.edit__input[aria-label="Паддинги (верт. / гор.)"]');
 var inputs=d.querySelectorAll('.edit__input[aria-label="Паддинги (верт. / гор.)"]');
 inputs[0].value=10; inputs[0].dispatchEvent(new Event('input'));
 L.push('ПОСЛЕ ПРАВКИ (введено 40 и верт. паддинг 10):');
 L.push('  '+m(d,'mobile','.ds-btn--m','height')+' / '+m(d,'mobile','.ds-btn--m','paddingTop'));
 L.push('  '+m(d,'desktop','.ds-btn--m','height')+' (десктоп не должен поехать)');
 L.push('  текст в колонке Mobile: '+[...d.querySelectorAll('tr')].filter(function(tr){return tr.textContent.indexOf('Высота')===0;})[0].querySelectorAll('td')[2].textContent);
 L.push('  style#live: '+d.getElementById('live').textContent.replace(/\n/g,' | '));
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src',BASE+'button.html');
</script></body></html>

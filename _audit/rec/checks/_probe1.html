<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>probe</title>
<style>html,body{margin:0;background:#fff;font:12px/16px monospace}pre{white-space:pre-wrap}</style>
</head>
<body>
<iframe id="f" style="width:1544px;border:0;display:block;height:600px"></iframe>
<pre id="out">pending</pre>
<script>
// Одностраничный пробник: грузим ОДНУ страницу компонента и меряем её синхронно
// в onload (родительский load наступает позже, поэтому результат попадает в --dump-dom).
var params = new URLSearchParams(location.search);
var BASE = '../../../iiko-ds-mobile/prototypes/recommendations/';
var slug = params.get('slug') || 'button';
var f = document.getElementById('f');
var out = document.getElementById('out');
var lines = [];
f.onload = function () {
  try {
    var d = f.contentDocument;
    var body = d.body;
    var pd = parseFloat(d.defaultView.getComputedStyle(body).paddingBottom) || 0;
    var kids = [].slice.call(body.querySelectorAll('div.wrap > *'));
    lines.push('slug=' + slug + ' kids=' + kids.length + ' scrollH=' + d.documentElement.scrollHeight +
               ' bodyScrollH=' + body.scrollHeight + ' bodyPadBottom=' + pd);
    kids.slice(-3).forEach(function (k) {
      var r = k.getBoundingClientRect();
      var cs = d.defaultView.getComputedStyle(k);
      lines.push('   ' + k.tagName + '.' + (k.className || '-') + ' top=' + Math.round(r.top) +
                 ' bottom=' + Math.round(r.bottom) + ' h=' + Math.round(r.height) +
                 ' mb=' + cs.marginBottom + ' mt=' + cs.marginTop);
    });
    // на всякий случай: что вообще ниже последнего элемента обёртки
    lines.push('   docElScrollH-lastBottom=' + Math.round(d.documentElement.scrollHeight - kids[kids.length - 1].getBoundingClientRect().bottom));
    out.textContent = lines.join(String.fromCharCode(10));
  } catch (e) { out.textContent = 'ERR ' + e; }
};
f.setAttribute('src', BASE + slug + '.html');
</script>
</body>
</html>

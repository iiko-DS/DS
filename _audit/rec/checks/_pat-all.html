<!doctype html><meta charset="utf-8"><body><pre id="out">pending</pre>
<script>
const SLUGS=["autocomplete", "backdrop", "badge", "banners", "button-icon", "button-toggle", "button", "card", "checkbox", "chips-input", "chips", "datepicker", "dialog", "divider", "expansion-panel", "form-field", "hint-tooltip", "icon-size", "input-number", "list", "logo", "menu", "radio", "scroll", "search", "select", "sidenav", "slide-toggle", "snackbar", "status", "stepper", "table-2-lvl", "table", "tabs", "text-ui", "textarea", "timepicker", "tree"];
const OUT=[]; let i=0;
const N="\u043f\u0430\u0442\u0442\u0435\u0440\u043d\u044b";
function next(){
  if(i>=SLUGS.length){document.getElementById('out').textContent=OUT.join('\n');return;}
  const slug=SLUGS[i++];
  const f=document.createElement('iframe');
  f.style.cssText='width:1600px;height:900px;border:0;position:absolute;left:-99999px';
  f.src='/iiko-ds-mobile/prototypes/recommendations/'+slug+'.html';
  f.onload=()=>setTimeout(()=>{
    try{
      const d=f.contentDocument;
      const c=[...d.querySelectorAll('.card')].find(x=>x.querySelector('h2')&&x.querySelector('h2').textContent.includes(N));
      if(!c){OUT.push(slug+' | НЕТ БЛОКА');}
      else{
        const bar=c.querySelector('.pat__tabs'); const tabs=[...bar.querySelectorAll('.ds-tab')];
        const panels=[...c.querySelectorAll('.pat__panel')];
        const ex=panels.filter(p=>p.querySelector('.pat__ex')).length;
        const notes=panels.filter(p=>p.querySelector('.pat__ex')&&!p.querySelector('.pat__ex-note')).length;
        OUT.push(slug+' | табов '+tabs.length+' | панелей '+panels.length+' | с примером '+ex
          +' | переполнение '+(bar.scrollWidth>bar.clientWidth?'да ('+bar.scrollWidth+'>'+bar.clientWidth+')':'нет')
          +' | примеров без подписи '+notes);
      }
    }catch(e){OUT.push(slug+' | ОШИБКА '+e.message);}
    f.remove(); next();
  },350);
  document.body.appendChild(f);
}
next();
</script></body>

<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>p6</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body><iframe id="f" style="width:1920px;height:1900px;border:0"></iframe><pre id="out">pending</pre>
<script>
var BASE='../../../iiko-ds-mobile/prototypes/recommendations/';
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
function h(d,q){var el=d.querySelector(q);return el?Math.round(el.getBoundingClientRect().height):-1;}
f.onload=function(){try{
 var d=f.contentDocument;
 L.push('до: панель mobile='+h(d,'.panel[data-mode="mobile"] .ds-btn--m')+' | экран телефона='+h(d,'.phone__screen .ds-btn--m')+' | десктоп='+h(d,'.panel[data-mode="desktop"] .ds-btn--m'));
 var i=d.querySelector('.edit__input[data-id="height"]'); i.value=40; i.dispatchEvent(new Event('input'));
 L.push('ввёл 40: панель mobile='+h(d,'.panel[data-mode="mobile"] .ds-btn--m')+' | экран телефона='+h(d,'.phone__screen .ds-btn--m')+' | десктоп='+h(d,'.panel[data-mode="desktop"] .ds-btn--m'));
 L.push('паддинг в поле: '+d.querySelector('.edit__input[data-id="pad-v"]').value);
 L.push('ширина кнопок на экране: '+(function(){var a=d.querySelectorAll('.phone__foot .ds-btn');return [].map.call(a,function(b){return Math.round(b.getBoundingClientRect().width);}).join(' и ');})());
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src',BASE+'button.html');
</script></body></html>

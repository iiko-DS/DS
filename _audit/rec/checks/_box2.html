<!doctype html><meta charset="utf-8"><body><pre id="out"></pre><script>
const P=[["autocomplete", [".ds-autocomplete-form__input-frame", ".ds-menu-item"]], ["list", [".ds-list-item", ".ds-list-container__item"]], ["menu", [".ds-menu-item"]], ["select", [".ds-select-form__input-frame", ".ds-select-item"]], ["textarea", [".ds-textarea__input-frame"]], ["form-field", [".ds-input--m .ds-input__frame", ".ds-input--s .ds-input__frame", ".ds-input--xs .ds-input__frame"]], ["button", [".ds-btn--m", ".ds-btn--s", ".ds-btn--xs"]], ["slide-toggle", [".ds-slide-toggle__track"]], ["dialog", [".ds-dialog-view__action"]], ["chips", [".ds-chips"]], ["tabs", [".ds-tab"]], ["table", [".ds-table-content-cell"]], ["tree", [".ds-tree-item"]], ["sidenav", [".ds-sidenav-item--l1"]]], OUT=[]; let i=0;
function next(){ if(i>=P.length){document.getElementById('out').textContent=OUT.join('\n');return;}
 const [page, sels]=P[i++]; const f=document.createElement('iframe'); f.style.cssText='width:1600px;height:1400px;border:0';
 f.src='/iiko-ds-mobile/prototypes/recommendations/'+page+'.html';
 f.onload=()=>setTimeout(()=>{const d=f.contentDocument, w=f.contentWindow;
  const row=[page];
  for (const mode of ['desktop','mobile']) { const pan=d.querySelector('.panel[data-mode="'+mode+'"]'); if(!pan){row.push(mode+':нет'); continue;}
    for (const s of sels) { const el=pan.querySelector(s); if(!el){row.push(mode+' '+s+' → нет'); continue;}
      const c=w.getComputedStyle(el), r=el.getBoundingClientRect();
      const hi=c.height!=="auto"?c.height:"auto"; const mh=c.minHeight!=="auto"?c.minHeight:"—";
      row.push(mode+' '+s+' → '+Math.round(r.height)+' px (height '+hi+', min '+mh+')'); } }
  OUT.push(row.join(' | ')); f.remove(); next();},330);
 document.body.appendChild(f);}
next();</script></body>

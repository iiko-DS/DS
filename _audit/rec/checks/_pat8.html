<!doctype html><meta charset="utf-8"><style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style><body>
<iframe id="f" width="1600" height="5000"></iframe>
<script>
const q=new URLSearchParams(location.search);
const slug=q.get('slug')||'button', k=parseInt(q.get('tab')||'0',10);
const f=document.getElementById('f');
f.src='/iiko-ds-mobile/prototypes/recommendations/'+slug+'.html';
f.onload=()=>setTimeout(()=>{
  const d=f.contentDocument,w=f.contentWindow,N="\u043f\u0430\u0442\u0442\u0435\u0440\u043d\u044b";
  const c=[...d.querySelectorAll('.card')].find(x=>x.querySelector('h2')&&x.querySelector('h2').textContent.includes(N));
  const tabs=[...c.querySelectorAll('.pat__tabs .ds-tab')]; if(tabs[k]) tabs[k].click();
  const top=Math.round(c.getBoundingClientRect().top+w.scrollY);
  f.style.height=Math.round(c.getBoundingClientRect().height)+60+'px';
  w.scrollTo(0, Math.max(0, top-10));
},600);
</script></body>

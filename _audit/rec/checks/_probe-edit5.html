<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>p5</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body><iframe id="f" style="width:1920px;height:1500px;border:0"></iframe><pre id="out">pending</pre>
<script>
var BASE='../../../iiko-ds-mobile/prototypes/recommendations/';
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
f.onload=function(){try{
 var d=f.contentDocument;
 function btn(){var el=d.querySelector('.panel[data-mode="mobile"] .ds-btn--m');var cs=d.defaultView.getComputedStyle(el);
   return 'h='+Math.round(el.getBoundingClientRect().height)+' pad='+cs.paddingTop+'/'+cs.paddingLeft;}
 function val(id){return d.querySelector('.edit__input[data-id="'+id+'"]').value;}
 function set(id,v){var i=d.querySelector('.edit__input[data-id="'+id+'"]');i.value=v;i.dispatchEvent(new Event('input'));}
 L.push('до: кнопка '+btn()+' | height='+val('height')+' pad-v='+val('pad-v')+' pad-h='+val('pad-h'));
 set('height',40);
 L.push('ввёл высоту 40 → кнопка '+btn()+' | height='+val('height')+' pad-v='+val('pad-v')+' (пересчёт виден)');
 set('pad-v',8);
 L.push('ввёл паддинг 8 → кнопка '+btn()+' | height='+val('height')+' pad-v='+val('pad-v'));
 L.push('колонка Mobile: '+[].slice.call(d.querySelectorAll('tr')).filter(function(tr){return tr.cells[0].textContent==='Высота';})[0].cells[2].textContent.trim());
 L.push('десктоп кнопка: '+Math.round(d.querySelector('.panel[data-mode="desktop"] .ds-btn--m').getBoundingClientRect().height));
 L.push('live: '+d.getElementById('live').textContent.replace(/\n/g,' | '));
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src',BASE+'button.html');
</script></body></html>

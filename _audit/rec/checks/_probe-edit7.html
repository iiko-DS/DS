<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><title>p7</title><style>pre{font:13px/17px monospace;white-space:pre-wrap}</style></head>
<body><iframe id="f" style="width:1920px;height:2200px;border:0"></iframe><pre id="out">pending</pre>
<script>
var BASE='../../../iiko-ds-mobile/prototypes/recommendations/';
var f=document.getElementById('f'),out=document.getElementById('out'),L=[];
function hs(d,q){return [].map.call(d.querySelectorAll(q),function(e){return Math.round(e.getBoundingClientRect().height);}).join('/');}
function ws(d,q){return [].map.call(d.querySelectorAll(q),function(e){return Math.round(e.getBoundingClientRect().width);}).join('/');}
f.onload=function(){try{
 var d=f.contentDocument;
 L.push('высоты кнопок ДО:');
 L.push('  панель mobile      : '+hs(d,'.panel[data-mode="mobile"] .ds-btn'));
 L.push('  экран 1 футер      : '+hs(d,'.phone:nth-of-type(1) .ds-btn')+' | ширины '+ws(d,'.phones__item:nth-child(1) .phone__foot .ds-btn'));
 L.push('  экран 2 контент    : '+hs(d,'.phones__item:nth-child(2) .ds-btn')+' | ширины '+ws(d,'.phones__item:nth-child(2) .phone__actions .ds-btn'));
 L.push('  экран 3 шторка     : '+hs(d,'.phones__item:nth-child(3) .ds-btn')+' | ширины '+ws(d,'.phones__item:nth-child(3) .phone__actions .ds-btn'));
 L.push('  десктоп            : '+hs(d,'.panel[data-mode="desktop"] .ds-btn'));
 var i=d.querySelector('.edit__input[data-id="height"]'); i.value=40; i.dispatchEvent(new Event('input'));
 L.push('ПОСЛЕ ввода 40:');
 L.push('  панель mobile      : '+hs(d,'.panel[data-mode="mobile"] .ds-btn'));
 L.push('  экран 1 футер      : '+hs(d,'.phones__item:nth-child(1) .ds-btn'));
 L.push('  экран 2 контент    : '+hs(d,'.phones__item:nth-child(2) .ds-btn'));
 L.push('  экран 3 шторка     : '+hs(d,'.phones__item:nth-child(3) .ds-btn'));
 L.push('  десктоп            : '+hs(d,'.panel[data-mode="desktop"] .ds-btn'));
 L.push('  паддинг в поле     : '+d.querySelector('.edit__input[data-id="pad-v"]').value);
 L.push('  колонка Mobile     : '+[].slice.call(d.querySelectorAll('tr')).filter(function(tr){return tr.cells[0].textContent==='Высота';})[0].cells[2].textContent.trim());
 out.textContent=L.join(String.fromCharCode(10));
}catch(e){out.textContent='ERR '+e;}};
f.setAttribute('src',BASE+'button.html');
</script></body></html>
